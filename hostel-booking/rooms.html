<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room Management</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>🏠 Add New Room</h1>
    <p>Owner only room management</p>
    <p><a href="/booking/admin">Admin Dashboard</a> | <a href="/booking/payments">Payments</a> | <form method="POST" action="/logout" style="display:inline"><button type="submit" class="btn-secondary">Log Out</button></form></p>
  </header>

  <main class="container">
    <div class="card">
      <h2 class="card-title">New Room Details</h2>
      <form id="roomForm">
        <div class="form-group">
          <label for="roomNumber">Room Number</label>
          <input id="roomNumber" name="roomNumber" required />
          <p class="error-msg" id="err-roomNumber"></p>
        </div>

        <div class="form-group">
          <label for="seaterType">Seater Type</label>
          <select id="seaterType" name="seaterType" required>
            <option value="">-- Select --</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
          <p class="error-msg" id="err-seaterType"></p>
        </div>

        <div class="form-group">
          <label for="monthlyFee">Monthly Fee</label>
          <input id="monthlyFee" name="monthlyFee" type="number" min="1" required />
          <p class="error-msg" id="err-monthlyFee"></p>
        </div>

        <button type="submit" class="btn-submit">Add Room</button>
      </form>

      <div class="success-box" id="roomSuccess" style="display:none">Room added successfully!</div>
      <div class="error-msg" id="roomError" style="display:none"></div>
    </div>
  </main>

  <script src="rooms.js"></script>
</body>
</html>
