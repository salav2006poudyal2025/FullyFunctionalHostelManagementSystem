<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Booking Management</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>🏢 Admin Dashboard</h1>
    <p>Manage student booking requests</p>
    <p><a href="/booking/warden">Warden Dashboard</a> | <a href="/booking">Student Booking</a></p>
  </header>

  <main class="container">
    <section class="card">
      <h2 class="card-title">Pending Booking Requests</h2>
      <div class="table-responsive">
        <table id="pendingTable" class="table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Room</th>
              <th>Check-in</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="mt-12">
        <span>Last updated: <strong id="lastUpdate">-</strong></span>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">All Bookings</h2>
      <div class="table-responsive">
        <table id="allBookingsTable" class="table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Room</th>
              <th>Status</th>
              <th>Actioned By</th>
              <th>Actioned At</th>
              <th>Rejection Reason</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal for rejection reason -->
  <div id="rejectModal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>Reject Booking</h3>
      <p>Provide a reason for rejection:</p>
      <textarea id="rejectReason" rows="4" placeholder="Enter rejection reason..."></textarea>
      <div class="modal-actions">
        <button id="confirmReject" class="btn-danger">Reject</button>
        <button id="cancelReject" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
